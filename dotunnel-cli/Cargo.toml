[package]
name = "dotunnel-cli"
version = "0.0.1"
authors = ["Hyeseong Kim <hey@hyeseong.kim>"]
edition = "2024"
homepage = "https://github.com/cometkim/dotunnel/tree/main/dotunnel-cli"
repository = "https://github.com/cometkim/dotunnel"
license = "MIT"

[[bin]]
name = "dotunnel"
path = "src/main.rs"
bench = false

[dependencies]
anyhow = "1.0"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4.5.4", features = ["derive", "env"] }
clap-verbosity-flag = "2.2.0"
ctrlc = { version = "3", features = ["termination"] }
dirs-sys = "0.4.1"
dotunnel = { workspace = true }
http = "1"
open = "5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tungstenite = { version = "0.26", features = ["native-tls"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
url = "2"
